[filter_local]
# Tailscale CGNAT 网段直连（QX 无 PROCESS-NAME，无法迁移 tailscaled 进程规则，仅保留 IP 段）
ip-cidr, 100.64.0.0/10, direct, no-resolve
ip6-cidr, fd7a:115c:a1e0::/48, direct, no-resolve

# GitHub 全家桶（防止 DNS 污染导致规则加载失败），放在远端规则前优先生效
host-suffix, raw.githubusercontent.com, PROXY
host-suffix, githubusercontent.com, PROXY
host-suffix, githubassets.com, PROXY
host-suffix, github.com, PROXY
host-suffix, github.io, PROXY
host-suffix, ghcr.io, PROXY
host-keyword, github, PROXY

# Max（HBO）补充域名
host-suffix, litix.io, Max
host-suffix, discomax.com, Max
host-suffix, brightline.tv, Max

# 苹果私有 TLD 直接拒绝，避免触发 5 秒 DNS 超时
host-suffix, safebrowsing.apple, reject

# CN 地区 IP 直连
geoip, cn, direct

# 兜底：其余全部走代理
final, PROXY

