[filter_local]
# 注意：本区在 [filter_remote] 之后匹配，主要作用是远端规则未加载时的兜底。

# Tailscale CGNAT 网段直连（QX 无 PROCESS-NAME，靠 IP 段匹配；direct_ip.list 里也有同样规则，
# 这里保留一份本地副本，保证远端规则加载失败时 Tailscale 也不受影响）
ip-cidr, 100.64.0.0/10, direct, no-resolve
ip6-cidr, fd7a:115c:a1e0::/48, direct, no-resolve

# GitHub 全家桶兜底（首次导入/远端规则加载失败时，保证 raw.githubusercontent.com 走代理，
# 规则集和订阅才能下载得动；远端加载成功后 GitHub.list 会先匹配，策略同为 PROXY，不冲突）
host-suffix, raw.githubusercontent.com, PROXY
host-suffix, githubusercontent.com, PROXY
host-suffix, githubassets.com, PROXY
host-suffix, github.com, PROXY
host-suffix, github.io, PROXY
host-suffix, ghcr.io, PROXY
host-keyword, github, PROXY

# Max（HBO）补充域名。
# 注：discomax.com / brightline.tv 也在 Global.list（策略 PROXY）里且远端先匹配，
# 实际按 Global→PROXY 走；此处保底 litix.io 并在远端失效时兜底其余两个。
host-suffix, litix.io, Max
host-suffix, discomax.com, Max
host-suffix, brightline.tv, Max

# CN 地区 IP 直连
geoip, cn, direct

# 兜底：其余全部走代理
final, PROXY

