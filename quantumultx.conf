# Quantumult X 配置（不含订阅，节点订阅请自行添加，见 [server_remote] 说明）
# 由 ss.conf（Shadowrocket 懒人配置）的分流逻辑整理而来，2026-07-07
#
# 使用步骤：
# 1. 导入本配置（设置 → 配置文件 → 下载/替换）
# 2. 添加你自己的节点订阅：节点 → 节点资源 → 引用，或直接编辑 [server_remote]
# 3. 住宅/静态IP节点的名称需包含以下任一关键词，才能被「住宅节点」分组自动识别：
#    住宅 / 静态 / 家宽 / Residential / Static / ISP（也可自行修改下方 server-tag-regex）
# 4. 首页勾选一个主力节点（内置 proxy 策略与 final 兜底都跟随该选择）

[general]
# 节点连通性测试地址
server_check_url = http://www.gstatic.com/generate_204
# 地理位置检测
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# 资源解析器（解析非 QX 原生格式的订阅/规则时用到）
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# UDP 流量匹配到不支持 UDP 转发的节点时回退直连，避免语音/视频通话失败
# （对应 ss.conf 的 udp-policy-not-supported-behaviour=DIRECT）
fallback_udp_policy = direct
# ping 自动回复（对应 ss.conf 的 icmp-auto-reply=true）
icmp_auto_reply = true
# 不经 QX 处理的路由（对应 ss.conf 的 tun-excluded-routes；
# 同样不含 100.64.0.0/10——该路由留给 Tailscale 自己的 utun 接口）
excluded_routes = 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32
# 不使用 QX 假IP(198.18.0.0/15)机制的域名（对应 ss.conf 的 always-real-ip + [Host] server:system）：
# - 运营商认证类（原配置保留）
# - 苹果推送/系统服务、微软登录/网络检测、游戏主机、STUN（假IP会导致异常）
# - safebrowsing.apple 为苹果私有 TLD，交给系统 DNS 快速返回 NXDOMAIN，避免 5 秒超时
# - 国内银行类
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.apple.com, *.icloud.com, *.crashlytics.com, *.push.apple.com, *.safebrowsing.apple, login.microsoftonline.com, *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, *.xboxlive.com, stun.*, *.ccb.com, *.abchina.com.cn, *.psbc.com

[dns]
# 关闭 IPv6 解析，减少多余的 AAAA 查询（对应 ss.conf 的 ipv6=false）
no-ipv6
# DoH3 优先，失败自动回落 HTTP/2（对应 ss.conf 的 h3:// DNS，防污染）
prefer-doh3
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
# 注：设置了 doh-server 后，下面这两条普通 DNS 会被忽略；
# 若想改回明文 UDP 解析，注释掉上面两行即可启用
server = 223.5.5.5
server = 119.29.29.29
# 域名级 DNS 绑定（对应 ss.conf [Host]：淘系/支付宝走阿里DNS，腾讯系/京东/B站走 dnspod；
# 字节系/飞书 TTL 极短、查询频繁，绑定后走 QX 缓存链路）
server = /*.taobao.com/223.5.5.5
server = /*.tmall.com/223.5.5.5
server = /*.alipay.com/223.5.5.5
server = /*.douyin.com/223.5.5.5
server = /*.amemv.com/223.5.5.5
server = /*.jd.com/119.29.29.29
server = /*.qq.com/119.29.29.29
server = /*.bilibili.com/119.29.29.29
server = /*.163.com/119.29.29.29
server = /*.zijieapi.com/119.29.29.29
server = /*.feishu.cn/119.29.29.29

[policy]
# 住宅节点：按节点名正则自动筛选订阅里的住宅/静态IP节点
static = 住宅节点, server-tag-regex=住宅|静态|家宽|Residential|Static|ISP
# 代理IP：住宅IP被封时的备用出口（proxy 为内置策略，跟随首页勾选的节点）
static = 代理IP, proxy, 住宅节点
# 按服务独立分组（默认走住宅节点；某服务的住宅IP被封时，
# 在首页单独把该服务切到「代理IP」，不影响其他服务，恢复后切回）
static = Claude, 住宅节点, 代理IP
static = ChatGPT, 住宅节点, 代理IP
static = 住宅IP, 住宅节点, 代理IP
# Max(HBO) 补充域名的策略
static = Max, proxy

[server_remote]
# ↓↓ 在这里添加你自己的节点订阅（或通过界面：节点 → 节点资源 → 引用）↓↓
# 格式示例：
# https://example.com/your-subscription-url, tag=订阅名, update-interval=172800, opt-parser=false, enabled=true
# 非 QX 原生格式的订阅加 opt-parser=true 由资源解析器转换

[filter_remote]
# ss-rule 融合分流规则集（Tailscale直连 → GitHub代理 → Claude/ChatGPT住宅IP →
# AI/YouTube代理 → Max → 直连；276条，随仓库自动更新）
# ⚠️ 保持在最上面：若再添加其他分流引用（如 blackmatrix7 Global），必须排在它下面，
#    否则 Claude/ChatGPT 会被抢先匹配走普通代理而不是住宅IP
https://raw.githubusercontent.com/zouhuigang/ss-rule/refs/heads/claude/ss-conf-qx-ruleset-yqhau7/rules/quantumultx/ss-rule.list, tag=ss, update-interval=172800, opt-parser=false, enabled=true
# QX 内置：中国大陆域名/IP直连、局域网直连（对应 ss.conf 的 China.list/Lan.list）
FILTER_REGION, tag=CN, force-policy=direct, inserted-resource=true, enabled=true
FILTER_LAN, tag=LAN, force-policy=direct, inserted-resource=true, enabled=true

[filter_local]
# —— 自定义规则（原配置保留）——
host-suffix, yang-1989.xyz, proxy
host, cache.ott.fifalive.itv.cmvideo.cn, direct
host, sni.cdn.weixin.qq.com, direct
host, extshort.weixin.qq.com, direct
host-suffix, weixin.qq.com, direct
# —— IP 兜底（远端规则未命中时）——
geoip, cn, direct
geoip, us, proxy
# —— 最终兜底：其余全部走代理（跟随首页勾选节点）——
final, proxy

[rewrite_local]
# Google 搜索防跳转（对应 ss.conf [URL Rewrite]）
^https?://(www\.)?g\.cn url 302 https://www.google.com
^https?://(www\.)?google\.cn url 302 https://www.google.com

[rewrite_remote]

[server_local]

[task_local]

[http_backend]

