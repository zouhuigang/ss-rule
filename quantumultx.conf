# Quantumult X 分流配置
# 由本仓库 ss.conf（Shadowrocket 懒人配置）转换而来
# 生成日期：2026-07-06
#
# 转换说明（Shadowrocket -> Quantumult X）：
# 1. [Proxy Group]  -> [policy]
#    select      -> static（第一个候选即默认策略，已按 policy-select-name 调整顺序）
#    url-test    -> url-latency-benchmark（policy-regex-filter -> server-tag-regex）
# 2. [Rule] 里的 RULE-SET(远端规则集) -> [filter_remote]，force-policy 指定策略
#    blackmatrix7 的 Shadowrocket 规则集已改用其 QuantumultX 版本（已逐条验证 URL 可用）
# 3. [Rule] 里的本地域名/IP 规则 -> [filter_local]
# 4. [Host] 的 DNS 覆写 -> [dns] 的 server=/domain/ip；“server:system”类 -> [general] 的 dns_exclusion_list
#
# ⚠️ QX 与 Shadowrocket 的规则匹配顺序差异（重要）：
#    QX 先匹配 [filter_remote]（自上而下），再匹配 [filter_local]。
#    因此走住宅 IP 的 Claude/ChatGPT 规则集必须放在 [filter_remote] 最顶部——
#    Global.list 里同样含有 anthropic.com / claude.ai / openai 域名(策略 PROXY)，
#    顺序一旦颠倒，Claude 流量就会走普通代理而不是住宅 IP。请勿调整顺序！
#
# 其他已知差异：
# - QX 不支持 PROCESS-NAME 规则（ss.conf 里该规则本身也无效，已在 ss.conf 注释掉），
#   Tailscale 直连由 CGNAT 网段(100.64.0.0/10 / fd7a:115c:a1e0::/48)的 IP 规则承担。
# - QX 不支持 DoH3(h3://)，DNS 已降级为对应的 https:// DoH（doh-server 指令）。
# - “专属纯净静态住宅节点”原为 ss.conf 里的具体节点名，这里做成按节点名正则筛选的分组，
#   请把你的住宅/静态 IP 节点命名为包含 住宅/静态/家宽/Residential/Static/ISP 关键词，或自行改正则。
# - ss.conf 的 block-quic=all-proxy（仅对代理连接屏蔽 QUIC）在 QX 无精确等价物；
#   如需屏蔽可启用下方注释掉的 udp_drop_list=443，但它会连国内直连的 QUIC 一起屏蔽。

[general]
# 节点连通性/测速地址
server_check_url = http://www.gstatic.com/generate_204
# 地理位置检测
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# 资源解析器：用于解析本仓库 Shadowrocket 格式的远端规则集（opt-parser=true 的条目）
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# 对应 ss.conf 的 udp-policy-not-supported-behaviour=DIRECT：
# UDP 流量匹配到不支持 UDP 转发的节点时回退直连，避免语音/视频通话失败
fallback_udp_policy = direct
# 对应 ss.conf 的 icmp-auto-reply=true
icmp_auto_reply = true
# 对应 ss.conf 的 tun-excluded-routes（同样不含 100.64.0.0/10，把该路由留给 Tailscale 的 utun）
excluded_routes = 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32
# 这些域名不使用 QX 的 DNS 模块、交给系统解析。
# 对应 ss.conf [Host] 的 server:system 项（apple/icloud/safebrowsing.apple）
# 以及 skip-proxy 里的银行类域名。
# safebrowsing.apple 是苹果私有 TLD，公共 DNS 必然 5 秒超时，系统 mDNSResponder 会直接返回 NXDOMAIN。
dns_exclusion_list = *.apple.com, *.icloud.com, *.safebrowsing.apple, captive.apple.com, *.ccb.com, *.abchina.com.cn, *.psbc.com
# 如需强制 HTTP3/QUIC 回退到 HTTP2，可启用（注意：会连国内直连的 QUIC 一起屏蔽）
# udp_drop_list = 443

[dns]
# 关闭 IPv6，避免多余的 AAAA 查询（对应 ss.conf 的 ipv6=false）
no-ipv6
# DoH 优先（QX 用 doh-server 指令；不支持 DoH3，已由 ss.conf 的 h3:// 降级为 https://）
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
# 明文 UDP 作补位（配置了 doh-server 时 QX 优先走 DoH）
server = 223.5.5.5
server = 119.29.29.29
# [Host] 域名级 DNS 覆写（QX 语法不写通配符，域名默认覆盖其全部子域名）
server = /taobao.com/223.5.5.5
server = /tmall.com/223.5.5.5
server = /alipay.com/223.5.5.5
server = /jd.com/119.29.29.29
server = /qq.com/119.29.29.29
server = /bilibili.com/119.29.29.29
server = /163.com/119.29.29.29
# 字节系/飞书：TTL 极短、查询频繁，直接绑定 dnspod
server = /zijieapi.com/119.29.29.29
server = /feishu.cn/119.29.29.29
server = /douyin.com/223.5.5.5
server = /amemv.com/223.5.5.5

[policy]
# ===== 地区节点（自动测速，按节点名正则筛选）=====
url-latency-benchmark = 香港节点, server-tag-regex=(?i)🇭🇰|HK|Hong|香港|深港|沪港|京港|港, check-interval=600, tolerance=100
url-latency-benchmark = 台湾节点, server-tag-regex=(?i)🇹🇼|TW|TWN|Taiwan|Taipei|台湾|台灣|台北|台中|新北|彰化, check-interval=600, tolerance=100
url-latency-benchmark = 日本节点, server-tag-regex=(?i)🇯🇵|JP|Japan|Tokyo|Osaka|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日, check-interval=600, tolerance=100
url-latency-benchmark = 新加坡节点, server-tag-regex=(?i)🇸🇬|SG|Sing|新加坡|狮城|沪新|京新|深新|杭新|广新, check-interval=600, tolerance=100
url-latency-benchmark = 韩国节点, server-tag-regex=(?i)🇰🇷|KR|Korea|KOR|韩国|首尔|韩|韓|春川, check-interval=600, tolerance=100
url-latency-benchmark = 美国节点, server-tag-regex=(?i)🇺🇸|US|USA|America|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美, check-interval=600, tolerance=100

# ===== 通用代理组 =====
# PROXY：总代理出口，手动在地区间切换
static = PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, direct
# 住宅/静态 IP 节点（按节点名正则筛选，请把住宅节点命名为含 住宅/静态/家宽/Residential 等关键词）
url-latency-benchmark = 专属纯净静态住宅节点, server-tag-regex=(?i)住宅|静态|家宽|家庭|Residential|Static|ISP, check-interval=600, tolerance=100
# 代理IP：住宅节点被封时的备用出口
static = 代理IP, PROXY, 专属纯净静态住宅节点

# ===== 需住宅 IP 的服务（手动切换，保证 IP 纯净度可控）=====
# 某个服务的住宅 IP 被封时，单独把该服务的分组切到「代理IP」，不影响其他服务；恢复后切回。
static = ChatGPT, 专属纯净静态住宅节点, 代理IP
static = Claude, 专属纯净静态住宅节点, 代理IP
static = 住宅IP, 专属纯净静态住宅节点, 代理IP

# ===== 流媒体 / 国际服务（默认策略已置于首位）=====
static = Netflix, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = Disney+, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = Max, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = TikTok, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = Spotify, PROXY, direct, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = Telegram, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = Twitter, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = Facebook, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = PayPal, PROXY, direct, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = Amazon, PROXY, direct, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = 谷歌服务, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = 游戏平台, PROXY, direct, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点

# ===== 默认直连、可选代理的服务 =====
static = 苹果服务, direct, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = 微软服务, direct, PROXY, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点
static = 哔哩哔哩, direct, PROXY, 香港节点, 台湾节点

